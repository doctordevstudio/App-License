<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#09090f">
  <title>Sign in · GZ Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=1">
</head>
<body class="login-body">
  <div class="blobs" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <main class="login-wrap">
    <form class="login-card" method="post" action="/login" autocomplete="on">
      <div class="logo-badge">⚡</div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to your control room.</p>
      {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label class="field"><span>Username</span>
        <input name="username" type="text" autocomplete="username" required maxlength="64" autofocus placeholder="your username">
      </label>
      <label class="field"><span>Password</span>
        <div class="pw">
          <input id="pw" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="••••••••••">
          <button type="button" id="pwToggle" class="icon-btn" aria-label="Show password">👁</button>
        </div>
      </label>
      <button class="btn primary block" type="submit">Sign in →</button>
      <p class="tiny muted center">Protected area · attempts are rate-limited &amp; logged</p>
    </form>
  </main>
  <script src="/static/js/login.js?v=1"></script>
</body>
</html>
